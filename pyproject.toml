[project]
name = "repolens"
version = "0.1.0"
description = "RepoLens: no-LLM Python repository ingestion, static analysis, graph construction, persistence, and deterministic comprehension API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# E501: line length is cosmetic; formatting is enforced by the editor.
# B008: FastAPI's documented dependency idiom is `Depends(...)` in defaults.
# UP042: `(str, Enum)` is kept deliberately; `enum.StrEnum` changes str()
#   formatting in a way that is not worth the churn for Phase 1.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "tests/fixtures"
